<script>
    // --- COUNTDOWN SCRIPT ---
    const targetDate = new Date("2026-12-26T08:00:00-07:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference <= 0) {
            document.getElementById("countdown-timer").innerHTML = "<p style='color: var(--accent-gold); font-family: \"Bree Serif\", serif; font-size: 1.2rem;'>We are live!</p>";
            clearInterval(timerInterval);
            return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = String(days).padStart(2, '0');
        document.getElementById("hours").innerText = String(hours).padStart(2, '0');
        document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
        document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    const timerInterval = setInterval(updateCountdown, 1000);


    // --- ICECAST NOW PLAYING & HISTORY SCRIPT ---
    const ICECAST_URL = 'https://janus.cdnstream.com/proxy/tmarinitest/status-json.xsl';
    const MOUNT_POINT = '/stream'; 
    const REFRESH_INTERVAL = 30000; // Polls every 30 seconds

    async function updateNowPlaying() {
        try {
            const response = await fetch(`${ICECAST_URL}?_=${new Date().getTime()}`);
            if (!response.ok) throw new Error('Network response was not ok');
            
            const data = await response.json();
            const sources = data.icestats.source;
            
            let currentSource = Array.isArray(sources) 
                ? sources.find(s => s.listenurl.includes(MOUNT_POINT)) 
                : sources;

            if (!currentSource) return;

            const titleFull = currentSource.title || "Unknown - Unknown";
            
            let artist = "Live Broadcast";
            let title = titleFull;
            if (titleFull.includes(" - ")) {
                const parts = titleFull.split(" - ");
                artist = parts[0].trim();
                title = parts.slice(1).join(" - ").trim();
            }

            document.getElementById('np-artist').textContent = artist;
            document.getElementById('np-title').textContent = title;

            updateHistory(artist, title);

        } catch (error) {
            console.error('Error fetching Icecast metadata:', error);
        }
    }

    let songHistory = [];
    function updateHistory(artist, title) {
        const currentSongString = `${artist} — ${title}`;
        
        if (songHistory.length === 0 || songHistory[0] !== currentSongString) {
            songHistory.unshift(currentSongString);
            if (songHistory.length > 4) { // Keeps current + last 3 songs in memory
                songHistory.pop();
            }
        }

        const historyList = document.getElementById('np-history');
        historyList.innerHTML = '';
        
        if (songHistory.length <= 1) {
            const li = document.createElement('li');
            li.textContent = "Accumulating history...";
            historyList.appendChild(li);
            return;
        }

        for (let i = 1; i < songHistory.length; i++) {
            const li = document.createElement('li');
            li.textContent = songHistory[i];
            historyList.appendChild(li);
        }
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, REFRESH_INTERVAL);
</script>
